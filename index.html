<!DOCTYPE html>
<html lang="th">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
body{background:#0b0e1a;color:#fff;font-family:"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px}
#hud{width:100%;max-width:1050px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#161c33;border:2px solid #3a4a7a;border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px}
.pill{background:#0e132a;border-radius:20px;padding:3px 10px;border:2px solid #2b3660;white-space:nowrap}

canvas{display:block;width:100%;height:100%;touch-action:none}
#touch{display:none;position:absolute;inset:auto 0 0 0;padding:0 14px 12px;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5}
body.touch #touch{display:flex}
.pad{pointer-events:auto;touch-action:none;background:rgba(46,61,117,.72);border:3px solid rgba(160,180,255,.6);color:#fff;border-radius:50%;width:clamp(56px,13vw,84px);height:clamp(56px,13vw,84px);font-size:clamp(22px,5vw,32px);font-weight:700;display:flex;align-items:center;justify-content:center}

.bar i{display:block;height:100%;background:linear-gradient(90deg,#43e97b,#ffd34d,#ff5f5f);width:100%}
input.txt{font-family:inherit;font-size:clamp(15px,2.1vw,20px);padding:11px;border-radius:10px;border:3px solid #4a5da8;background:#0e132a;color:#fff;width:min(420px,94%);text-align:center;display:block;margin:7px auto;-webkit-user-select:text;user-select:text}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}

<script>
/* ============================================================
   COMPARATIVE (-er / more ... than) ARCADE ADVENTURE · ป.4
   ✔ 4 ทักษะ: อ่าน(ออกเสียง+AI ตรวจ) ฟัง พูด(AI ตรวจ) เขียน
   ✔ ล็อกอิน ชื่อ/ชั้น/เลขที่ · รายงานครู · ส่งออก CSV
   ============================================================ */
const GOOGLE_SCRIPT_URL="";   /* ใส่ URL Google Apps Script (ถ้าไม่ใช้ ปล่อยว่าง) */
const DEFAULT_PASS="1234";    /* รหัสผ่านโหมดครู */

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=960,H=540;
const $=id=>document.getElementById(id);
const IS_TOUCH=('ontouchstart'in window)||navigator.maxTouchPoints>0;
if(IS_TOUCH)document.body.classList.add('touch');
const getSR=()=>window.SpeechRecognition||window.webkitSpeechRecognition;

/* ---------- 0) นักเรียน + รายงาน ---------- */
const STKEY='cmp_student_v1',RPKEY='cmp_report_v1',PWKEY='cmp_pass_v1';
let STU={name:'',cls:'',no:''},REP=[],SID=0;
const TYPN={read:'อ่านออกเสียง (AI ตรวจ)',readtap:'อ่าน (เลือกตอบ-ไม่มีไมค์)',listen:'ฟัง',type:'เขียน (พิมพ์)',order:'เรียงประโยค',speak:'พูด'};
function loadStu(){try{const d=JSON.parse(localStorage.getItem(STKEY)||'null');if(d)STU=d;}catch(e){}}
function saveStu(){try{localStorage.setItem(STKEY,JSON.stringify(STU));}catch(e){}}
function loadRep(){try{REP=JSON.parse(localStorage.getItem(RPKEY)||'[]');}catch(e){REP=[];}}
function saveRep(){try{if(REP.length>4000)REP=REP.slice(-4000);localStorage.setItem(RPKEY,JSON.stringify(REP));}catch(e){}}
function getPass(){try{return localStorage.getItem(PWKEY)||DEFAULT_PASS;}catch(e){return DEFAULT_PASS;}}
function setPass(p){try{localStorage.setItem(PWKEY,p);}catch(e){}}
function cloudSend(rec){if(!GOOGLE_SCRIPT_URL||GOOGLE_SCRIPT_URL.indexOf('http')!==0)return;
  try{fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)});}catch(e){}}
function pushRec(o){const rec=Object.assign({t:Date.now(),sid:SID,name:STU.name,cls:STU.cls,no:STU.no},o);REP.push(rec);saveRep();cloudSend(rec);}
function logAns(ok,userAns,tkey){
  if(!curQ||!curQ.d)return;const d=curQ.d,ty=tkey||curQ.type;let qt=d.q||'';
  if(ty==='order')qt='เรียงประโยค → '+d.a;
  if(ty==='speak')qt='อ่านออกเสียง → '+d.s;
  if(ty==='listen')qt=(d.q||'')+' | ประโยคที่ฟัง: '+d.s;
  if(ty==='read')qt='อ่านประโยค → '+d.q.replace('___',d.o[d.a]);
  pushRec({kind:'ans',lv:G.lv,type:TYPN[ty]||ty,q:qt,ans:(userAns||'-'),ok:!!ok,sec:Math.max(0,Math.round(qTot-qSec)),score:G.score});}

function loginCard(){
  G.st='menu';stopMusic();
  showCard('<h2>👋 ยินดีต้อนรับสู่ COMPARATIVE ARCADE</h2>'+
   '<p style="font-size:14px;margin:6px 0">กรอกข้อมูลก่อนเริ่มเล่น เพื่อบันทึกคะแนนส่งคุณครู</p>'+
   '<input class="txt" id="iName" placeholder="ชื่อ - นามสกุล" value="'+esc(STU.name||'')+'" autocomplete="off">'+
   '<input class="txt" id="iCls" placeholder="ชั้น เช่น ป.4/1" value="'+esc(STU.cls||'')+'" autocomplete="off">'+
   '<input class="txt" id="iNo" placeholder="เลขที่" inputmode="numeric" value="'+esc(STU.no||'')+'" autocomplete="off">'+
   '<div class="fb" id="lfb"></div><button class="btn" onclick="doLogin()">▶ เริ่มเล่น</button>'+
   '<button class="btn2" onclick="teacherGate()">🔐 โหมดครู</button>'+
   '<small class="hintline">ข้อมูลนี้จะติดไปกับคะแนนทุกข้อ เพื่อให้คุณครูตรวจย้อนหลังได้</small>');
  const go=e=>{if(e.key==='Enter')doLogin();};['iName','iCls','iNo'].forEach(id=>{const el=$(id);if(el)el.onkeydown=go;});}
function doLogin(){
  const n=$('iName').value.trim(),c=$('iCls').value.trim(),o=$('iNo').value.trim();
  if(!n||!c||!o){$('lfb').innerHTML='<span class="bd">⚠️ กรุณากรอกให้ครบทั้ง 3 ช่อง</span>';return;}
  STU={name:n,cls:c,no:o};saveStu();SID=Date.now();audioUnlock();SFX.ui();
  pushRec({kind:'login',lv:0,type:'เข้าสู่ระบบ',q:'-',ans:'-',ok:true,sec:0,score:0});hud();menu();}
function changeStudent(){STU={name:'',cls:'',no:''};saveStu();loginCard();}
window.doLogin=doLogin;window.changeStudent=changeStudent;window.loginCard=loginCard;

function checkOri(){const port=innerHeight>innerWidth;document.body.classList.toggle('portrait',IS_TOUCH&&port);
  if(IS_TOUCH&&port&&G.st==='play')togglePause();}
addEventListener('resize',checkOri);addEventListener('orientationchange',()=>setTimeout(checkOri,250));
function tryFull(){const el=document.documentElement;
  if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch(()=>{});
    if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}
  else document.exitFullscreen().catch(()=>{});}
window.tryFull=tryFull;$('bFull').onclick=()=>{audioUnlock();tryFull();};

/* ---------- 1) เสียง ---------- */
let ac=null,mst,mgain,sgain,muted=false;
function audioInit(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();
  mst=ac.createGain();mst.gain.value=.9;mst.connect(ac.destination);
  mgain=ac.createGain();mgain.gain.value=.28;mgain.connect(mst);
  sgain=ac.createGain();sgain.gain.value=.55;sgain.connect(mst);}
function audioUnlock(){audioInit();if(ac.state==='suspended')ac.resume();}
const SEMI={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function NF(n){const m=/^([A-G]#?)(\d)$/.exec(n);if(!m)return 440;return 440*Math.pow(2,(((+m[2]+1)*12+SEMI[m[1]])-69)/12);}
function blip(f,wave,dur,t,g,dest){if(!ac||muted)return;t=t||ac.currentTime;const o=ac.createOscillator(),v=ac.createGain();
  o.type=wave;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.012);
  v.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(v);v.connect(dest||sgain);o.start(t);o.stop(t+dur+.02);}
function sweep(f1,f2,dur,g){if(!ac||muted)return;const t=ac.currentTime,o=ac.createOscillator(),v=ac.createGain();
  o.type='square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v);v.connect(sgain);o.start(t);o.stop(t+dur+.02);}
function noise(t,dur,g,hp){if(!ac||muted)return;const n=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource();s.buffer=b;
  const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1200;const v=ac.createGain();v.gain.value=g;
  s.connect(f);f.connect(v);v.connect(mgain);s.start(t);}
function kick(t){if(!ac||muted)return;const o=ac.createOscillator(),v=ac.createGain();o.type='sine';
  o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  v.gain.setValueAtTime(.5,t);v.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(v);v.connect(mgain);o.start(t);o.stop(t+.18);}
const snare=t=>noise(t,.14,.3,1400),hat=t=>noise(t,.03,.09,6000);
const seq=(a,w,d,g,gap)=>a.forEach((f,i)=>setTimeout(()=>blip(f,w,d,0,g),i*gap));
const SFX={
 jump(){sweep(380,880,.16,.14);},
 djump(){sweep(600,1500,.2,.16);setTimeout(()=>blip(1900,'triangle',.12,0,.1),90);},
 coin(){blip(1319,'square',.06,0,.14);setTimeout(()=>blip(1760,'square',.18,0,.14),55);},
 gem(){seq([988,1319,1568,1976,2637],'triangle',.2,.18,55);},
 stomp(){sweep(420,120,.14,.2);if(ac)noise(ac.currentTime,.08,.18,900);},
 hit(){sweep(300,90,.3,.22);},
 bump(){sweep(200,520,.1,.2);},
 correct(){seq([523,659,784,1046],'square',.14,.16,70);setTimeout(()=>[1046,1318,1568].forEach(f=>blip(f,'triangle',.5,0,.14)),300);},
 combo(n){seq([784,988,1175,1568,1976].slice(0,Math.min(5,n+1)),'square',.12,.16,60);},
 wrong(){seq([392,330,262],'triangle',.22,.18,130);},
 power(){seq([523,659,784,1046,1318,1568],'triangle',.12,.16,50);},
 clear(){seq([523,523,523,659,784,659,784,1046],'square',.2,.17,120);setTimeout(()=>[523,659,784,1046].forEach(f=>blip(f,'triangle',.9,0,.13)),1050);},
 bonus(){seq([784,988,1175,1568,1175,1568,1976],'square',.18,.2,95);},
 over(){seq([392,349,330,262],'triangle',.4,.2,200);},
 go(){seq([392,523,659,784],'square',.1,.15,70);},
 tickw(){blip(1000,'square',.06,0,.14);},ui(){blip(1200,'triangle',.05,0,.1);}};
const TR={
1:{bpm:134,root:60,sc:[0,2,4,7,9],prog:[0,-3,-7,-5],lw:'square',dr:1,mn:0},
2:{bpm:112,root:57,sc:[0,3,5,7,10],prog:[0,-4,-2,-5],lw:'triangle',dr:0,mn:1},
3:{bpm:152,root:52,sc:[0,3,5,6,7,10],prog:[0,0,-4,-2],lw:'sawtooth',dr:2,mn:1},
4:{bpm:128,root:67,sc:[0,2,4,5,7,9,11],prog:[0,-5,-3,-7],lw:'square',dr:1,mn:0},
5:{bpm:118,root:62,sc:[0,2,4,7,9],prog:[0,-2,-5,-7],lw:'sine',dr:0,mn:0},
6:{bpm:166,root:60,sc:[0,2,4,7,9],prog:[0,-3,-5,-7],lw:'square',dr:2,mn:0}};
const mtof=m=>440*Math.pow(2,(m-69)/12);
let mStep=0,mNext=0,mTimer=null,mLv=1,mPat=null;
function buildPat(lv){const T=TR[lv],r=mul32(777+lv*31),tri=T.mn?[0,3,7,12]:[0,4,7,12],lead=[];
  for(let b=0;b<4;b++){const rt=T.root+T.prog[b];
    for(let s=0;s<16;s++){const on=T.dr===2?(s%2===0||r()<.4):(s%4===0||(s%2===0&&r()<.55)||r()<.15);
      if(!on){lead.push(0);continue;}
      lead.push(rt+12+(r()<.6?tri[Math.floor(r()*tri.length)]:T.sc[Math.floor(r()*T.sc.length)]));}}
  return lead;}
function startMusic(lv){audioInit();stopMusic();mLv=lv;mStep=0;mPat=buildPat(lv);mNext=ac.currentTime+.08;
  mTimer=setInterval(()=>{if(!ac)return;const T=TR[mLv],spb=60/T.bpm/4;
    while(mNext<ac.currentTime+.14){const t=mNext,s=mStep%16,bar=Math.floor(mStep/16)%4,rt=T.root+T.prog[bar],tri=T.mn?[0,3,7]:[0,4,7];
      const ln=mPat[mStep%64];if(ln)blip(mtof(ln),T.lw,spb*1.8,t,.13,mgain);
      if(s%2===1)blip(mtof(rt+12+tri[(s>>1)%3]),'triangle',spb*1.2,t,.05,mgain);
      if(s%4===0||(T.dr>0&&s%4===2))blip(mtof(rt-12),'triangle',spb*2.2,t,.26,mgain);
      if(T.dr===0?s%8===0:s%4===0)kick(t);
      if(s===4||s===12)snare(t);
      if(T.dr>0?s%2===0:s%4===2)hat(t);if(T.dr===2&&s%2===1)hat(t);
      if(mStep%64>=56&&T.dr>0&&s%2===0)snare(t);
      mNext+=spb;mStep++;}},30);}
function stopMusic(){if(mTimer){clearInterval(mTimer);mTimer=null;}}
if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}

  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||.88;u.pitch=1.05;

/* ---------- 6) คำถาม ---------- */
let curQ=null,qTimer=null,qSec=0,qTot=0,hintUsed=false,warned=false;
const QTIME={read:90,listen:60,type:60,order:120,speak:90};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const norm=s=>s.toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ').trim();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const optsHtml=(o,ord)=>ord.map(i=>'<button class="opt" data-i="'+i+'">'+o[i]+'</button>').join('');

/* ตรวจเสียงพูด: ต้องมีคำ comparative ครบ + ตรงประโยค ≥70% */
function evalSpeech(alts,target,key){
  const tw=norm(target).split(' '),kw=norm(key).split(' ');let best={ok:false,pct:-1,txt:''};
  alts.forEach(a=>{const tk=norm(a).split(' '),r=tw.filter(w=>tk.includes(w)).length/tw.length;
    const ok=r>=.7&&kw.every(k=>tk.includes(k))&&(kw.includes('more')||!tk.includes('more'));
    if((ok&&!best.ok)||(ok===best.ok&&r>best.pct))best={ok,pct:r,txt:a};});
  return best;}
function recog(SR,cb){let got=false;const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;
  r.onresult=e=>{got=true;cb(Array.from(e.results[0]).map(x=>x.transcript));};
  r.onerror=e=>{if(!got){got=true;cb(null,e.error);}};
  r.onend=()=>{if(!got){got=true;cb(null,'no-speech');}};
  if('speechSynthesis'in window)speechSynthesis.cancel();
  try{r.start();}catch(_){got=true;cb(null,'fail');}}
const micErr=err=>(err==='not-allowed'||err==='service-not-allowed')?'⚠️ กรุณาอนุญาตให้ใช้ไมโครโฟน แล้วกดอีกครั้ง':'⚠️ ไม่ได้ยินเสียง ลองกดอีกครั้ง แล้วพูดให้ดังขึ้น';

function openQuiz(blk){
  G.st='quiz';stopMusic();
  for(const k in keys)keys[k]=false;const type=(G.qTypes||(G.qTypes=mixTypes()))[blk.i%6];curQ={blk,type};hintUsed=false;warned=false;qTot=QTIME[type]||60;qSec=qTot;
  const head='<h2>'+THEME[G.lv].ic+' ด่าน '+G.lv+' · ข้อ '+(G.qDone+1)+'/6</h2><div class="bar"><i id="qbar"></i></div>'+
    '<div id="qsec" style="font-size:13px;opacity:.9;margin-top:4px;font-weight:700">⏱ เหลือ '+fmt(qSec)+'</div>';
  ({read:qRead,listen:qListen,type:qType,order:qOrder,speak:qSpeak})[type](head);
  clearInterval(qTimer);
  qTimer=setInterval(()=>{qSec-=0.1;
    const b=$('qbar');if(b)b.style.width=Math.max(0,qSec/qTot*100)+'%';
    const s=$('qsec');if(s){s.textContent='⏱ เหลือ '+fmt(qSec);s.style.color=qSec<=10?'#ff8a8a':'';}
    if(!warned&&qSec<=10){warned=true;SFX.tickw();}
    if(qSec<=0){clearInterval(qTimer);finish(false,'⏰ หมดเวลา!','',' (ไม่ได้ตอบ/หมดเวลา)');}},100);}
const hintBtn=()=>'<button class="btn2" id="bh">💡 คำใบ้ ('+G.hint+')</button>';
function dimWrong(n,ans){shuffle([...document.querySelectorAll('.opt')].filter(b=>+b.dataset.i!==ans&&!b.dataset.dim)).slice(0,n)
  .forEach(b=>{b.dataset.dim=1;b.style.opacity=.25;if(!b.style.pointerEvents)b.disabled=true;});}
function bindMC(ans,tip,ansText){
  document.querySelectorAll('#op .opt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===ans,picked=b.textContent;
    document.querySelectorAll('#op .opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===ans)x.classList.add('ok');else if(x===b)x.classList.add('no');});
    finish(ok,ok?'✅ เก่งมาก! ถูกต้อง':'❌ คำตอบที่ถูกคือ '+ansText,tip,picked);});}

/* ===== อ่าน: เด็กต้องอ่านประโยคเต็มออกเสียง · AI ฟังแล้วตรวจแทนการกดส่งคำตอบ ===== */
function qRead(head){
  const d=drawQ('mc');curQ.d=d;const full=d.q.replace('___',d.o[d.a]),key=d.o[d.a],SR=getSR(),ord=shuffle(d.o.map((_,i)=>i));
  curQ.tkey=SR?'read':'readtap';let tries=2;
  const chips=ord.map(i=>'<button class="opt" data-i="'+i+'"'+(SR?' style="pointer-events:none"':'')+'>'+d.o[i]+'</button>').join('');
  showCard(head+'<p style="opacity:.85;font-size:13px">📖 ทักษะการอ่าน — '+(SR?'เลือกคำที่ถูกต้องใส่ในช่องว่าง แล้ว<b>อ่านประโยคเต็มออกเสียง</b> (AI จะฟังและตรวจให้)':'เลือกคำตอบที่ถูกต้อง (อุปกรณ์นี้ไม่รองรับไมโครโฟน)')+'</p>'+
   '<div class="q">'+d.q.replace('___','<b style="color:#ffd34d">______</b>')+'</div><div class="opts" id="op">'+chips+'</div>'+
   (SR?'<button class="btn" id="brec">🎤 กดแล้วอ่านประโยคเต็ม</button>':'')+hintBtn()+'<div class="fb" id="fb">'+(SR?'วิธีอ่าน: เลือกคำที่ถูกต้องในใจ แล้วอ่านทั้งประโยคตั้งแต่คำแรกถึงคำสุดท้าย':'')+'</div>');
  if(!SR)bindMC(d.a,d.t,d.o[d.a]);
  $('bh').onclick=()=>{if(G.hint<1||hintUsed)return;G.hint--;hintUsed=true;SFX.ui();dimWrong(1,d.a);hud();saveGame();};
  if(SR)$('brec').onclick=()=>{const b=$('brec');b.disabled=true;b.classList.add('rec');$('fb').textContent='🎙️ กำลังฟัง... อ่านประโยคเต็มเลย!';
    recog(SR,(alts,err)=>{if(!$('brec')||G.st!=='quiz')return;b.classList.remove('rec');b.disabled=false;
      if(!alts){$('fb').innerHTML=micErr(err);return;}
      const r=evalSpeech(alts,full,key),pc=Math.max(0,Math.round(r.pct*100)),sh=(r.txt||'(ไม่ได้ยินชัด)')+' ['+pc+'%]';
      if(r.ok){b.disabled=true;$('fb').textContent='🗣️ ได้ยินว่า: "'+r.txt+'" ('+pc+'% ตรงกัน)';
        setTimeout(()=>finish(true,'✅ อ่านออกเสียงถูกต้อง!<br><span style="font-size:.8em">'+full+'</span>',d.t,sh),900);}
      else{tries--;
        if(tries>0)$('fb').innerHTML='🗣️ ได้ยินว่า: "'+esc(r.txt||'?')+'" ('+pc+'%) — <span class="bd">ยังไม่ถูก ลองอีกครั้ง (เหลือ '+tries+' ครั้ง)</span>';
        else{b.disabled=true;$('fb').textContent='🗣️ ได้ยินว่า: "'+(r.txt||'?')+'"';
          setTimeout(()=>finish(false,'❌ ประโยคที่ถูกคือ "'+full+'"',d.t,sh),900);}}});};}

function qListen(head){
  const d=drawQ('listen');curQ.d=d;const ord=shuffle(d.o.map((_,i)=>i));
  showCard(head+'<p style="opacity:.85;font-size:13px">🎧 ทักษะการฟัง — กดปุ่มลำโพงเพื่อฟัง</p>'+
   '<button class="btn" id="bp">🔊 ฟังประโยค</button><button class="btn2" id="bs">🐢 ฟังช้า</button><div class="q">'+d.q+'</div>'+
   '<div class="opts" id="op">'+optsHtml(d.o,ord)+'</div>'+hintBtn()+'<div class="fb" id="fb"></div>');
  setTimeout(()=>say(d.s),400);$('bp').onclick=()=>say(d.s);$('bs').onclick=()=>say(d.s,.6);
  bindMC(d.a,'',d.o[d.a]);
  $('bh').onclick=()=>{if(G.hint<1||hintUsed)return;G.hint--;hintUsed=true;say(d.s,.55);dimWrong(1,d.a);hud();saveGame();};}
function qType(head){
  const d=drawQ('type');curQ.d=d;
  showCard(head+'<p style="opacity:.85;font-size:13px">✍️ ทักษะการเขียน — พิมพ์คำเปรียบเทียบ (comparative) ให้ถูกรูป</p>'+
   '<div class="q">'+d.q.replace('___','<b style="color:#ffd34d">______</b>')+'</div>'+

function qOrder(head){

   '<div class="slot" id="slot"></div><div class="words" id="pool">'+words.map((w,i)=>'<button class="w" data-i="'+i+'">'+w+'</button>').join('')+'</div>'+

  const chosen=[];

  $('bh').onclick=()=>{if(G.hint<1||hintUsed)return;G.hint--;hintUsed=true;SFX.ui();$('fb').innerHTML='💡 คำแรกของประโยคคือ "'+d.a.split(' ')[0]+'"';hud();saveGame();};}

/* ===== พูด: AI ฟังตรวจ (ปุ่มตรวจเองใช้ได้เฉพาะเครื่องที่ไม่มีไมค์) ===== */
function qSpeak(head){
  const d=drawQ('speak');curQ.d=d;const SR=getSR();let tries=2;
  showCard(head+'<p style="opacity:.85;font-size:13px">🗣️ ทักษะการพูด — อ่านประโยคออกเสียงให้ชัดเจน (AI ตรวจให้)</p>'+

function explain(sen){
  const w=sen.replace(/[.,!?]/g,'').split(' '),i=w.findIndex(x=>x.toLowerCase()==='than');if(i<1)return'';
  let cmp=w[i-1].toLowerCase(),how;

  else if(cmp==='better')how='<b>better</b> เป็นคำพิเศษ มาจาก <b>good</b> (ห้ามใช้ gooder)';
  else if(cmp==='worse')how='<b>worse</b> เป็นคำพิเศษ มาจาก <b>bad</b> (ห้ามใช้ badder)';
  else if(/ier$/.test(cmp))how='<b>'+cmp+'</b> มาจาก <b>'+cmp.slice(0,-3)+'y</b> → เปลี่ยน y เป็น i แล้วเติม -er';
  else if(/(gg|tt|dd|nn|mm)er$/.test(cmp))how='<b>'+cmp+'</b> มาจาก <b>'+cmp.slice(0,-3)+'</b> (พยางค์เดียว สระเดียว ตัวสะกดตัวเดียว) → ซ้ำตัวท้ายแล้วเติม -er';
  else if(/er$/.test(cmp))how='<b>'+cmp+'</b> มาจาก <b>'+cmp.slice(0,-2)+'</b> (คำสั้น) → เติม -er ได้เลย';
  else return'';
  return '🔎 <b>ทำไมถึงเป็นแบบนี้?</b><br>• '+how+'<br>• <b>than</b> แปลว่า "กว่า" ใช้ตามหลังคำเปรียบเทียบเสมอ<br>• โครงสร้าง: A + is + <b>คำเปรียบเทียบ</b> + than + B';}

const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function update(){

  const sp=(G.lv===5&&!bn)?3.6:4.6;
  if(keys.ArrowLeft||keys.a||keys.A){P.vx=-sp;P.face=-1;}else if(keys.ArrowRight||keys.d||keys.D){P.vx=sp;P.face=1;}else P.vx*=.72;
  const mj=maxJumps(),jk=keys[' ']||keys.ArrowUp||keys.w||keys.W,pressed=jk&&!P.jkPrev;P.jkPrev=jk;

    if(P.jumps===0&&P.coy>0){P.vy=JP;SFX.jump();}
    else{P.vy=JP*.94;SFX.djump();rings.push({x:P.x+15,y:P.y+P.h,r:6,l:26});

  if(P.x<0)P.x=0;
  P.y+=P.vy;P.gr=false;

    if(P.vy>0){P.y=o.y-P.h;P.vy=0;P.gr=true;P.jumps=0;P.safe={x:P.x,y:P.y};}

  L.ene.forEach(e=>{if(e.dead)return;e.x+=e.dir*(G.lv===3?1.9:1.25);if(e.x<e.min||e.x>e.max)e.dir*=-1;
    e.fl=Math.sin(tick/12)*(G.lv===2||G.lv===4?6:0);const eb={x:e.x,y:e.y+e.fl,w:e.w,h:e.h};

        for(let i=0;i<10;i++)parts.push({x:e.x+16,y:e.y,vx:(Math.random()-.5)*5,vy:-Math.random()*4,c:'#fff',l:24});}
      else if(G.star>0){e.dead=1;G.score+=100;SFX.stomp();hud();}

  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--;});parts=parts.filter(p=>p.l>0);

let shake=0;
const wrap=(x,t)=>((x%t)+t)%t;

function cloud(x,y,s,a){ctx.globalAlpha=a||.95;ctx.fillStyle='#fff';[[0,0,22],[24,-10,27],[54,0,22],[26,8,22]].forEach(c=>{ctx.beginPath();ctx.arc(x+c[0]*s,y+c[1]*s,c[2]*s,0,7);ctx.fill();});ctx.globalAlpha=1;}
function hills(par,col,base,amp,per){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=12)ctx.lineTo(x,base-Math.sin((x+par)/per)*amp-Math.sin((x+par)/(per*.43))*amp*.3);ctx.lineTo(W,H);ctx.fill();}
function draw(){ctx.save();if(shake>.5){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;}scene();ctx.restore();}

  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(G.st==='menu'||!L){bgDeco(1);ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,0,W,H);return;}

   '<input class="txt" id="fq" placeholder="🔎 ค้นหา ชื่อ / ชั้น / เลขที่" value="'+esc(RFILTER)+'">'+
   '<div class="wrap"><table class="tb"><thead><tr><th>ชั้น</th><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ตอบ</th><th>ถูก</th><th>ผิด</th><th>%</th><th>คะแนนสูงสุด</th><th>ล่าสุด</th><th>ราย<br>ละเอียด</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
   '<div style="margin-top:8px"><button class="btn4" onclick="exportCSV()">📥 ส่งออก CSV (Excel)</button><button class="btn2" onclick="changePass()">🔑 เปลี่ยนรหัสผ่าน</button>'+
   '<button class="btn3" onclick="clearReport()">🗑 ล้างรายงานทั้งหมด</button><button class="btn" onclick="backHome()">↩ กลับหน้าเกม</button></div>'+
   '<small class="hintline">ข้อมูลถูกเก็บในเครื่องนี้ (localStorage) แนะนำให้ส่งออก CSV เก็บไว้เป็นระยะ</small>');
  const f=$('fq');if(f)f.onkeydown=e=>{if(e.key==='Enter'){RFILTER=f.value;teacherReport();}};}
window.teacherReport=teacherReport;
function repDetail(i){const k=RKEYS[i];if(!k)return;const p=k.split('|');
  const list=REP.filter(r=>(r.cls||'-')===p[0]&&(r.no||'-')===p[1]&&(r.name||'-')===p[2]).slice().sort((a,b)=>b.t-a.t);let body='';
  list.forEach(r=>{const res=r.kind==='ans'?(r.ok?'<span class="gd">✔ ถูก</span>':'<span class="bd">✘ ผิด</span>'):'<span style="color:#ffd34d">'+esc(r.type)+'</span>';
    body+='<tr><td>'+dts(r.t)+'</td><td>'+(r.lv||'-')+'</td><td>'+esc(r.type)+'</td><td class="lft">'+esc(r.q)+'</td><td class="lft">'+esc(r.ans)+'</td><td>'+res+'</td><td>'+(r.sec||0)+'s</td><td>'+(r.score||0)+'</td></tr>';});
  if(!body)body='<tr><td colspan="8" style="padding:16px">— ไม่มีข้อมูล —</td></tr>';
  const ansL=list.filter(r=>r.kind==='ans'),ok=ansL.filter(r=>r.ok).length;
  showCard('<h2>👤 '+esc(p[2])+' · ชั้น '+esc(p[0])+' เลขที่ '+esc(p[1])+'</h2><p style="font-size:14px">ตอบ '+ansL.length+' ข้อ · ถูก <b class="gd">'+ok+'</b> · ผิด <b class="bd">'+(ansL.length-ok)+'</b> · คิดเป็น '+(ansL.length?Math.round(ok/ansL.length*100):0)+'%</p>'+
   '<div class="wrap"><table class="tb"><thead><tr><th>วัน-เวลา</th><th>ด่าน</th><th>ทักษะ</th><th>โจทย์</th><th>คำตอบนักเรียน / เสียงที่ AI ได้ยิน</th><th>ผล</th><th>เวลา</th><th>คะแนน</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
   '<div style="margin-top:8px"><button class="btn2" onclick="teacherReport()">↩ กลับหน้าสรุป</button><button class="btn3" onclick="delStudent('+i+')">🗑 ลบข้อมูลนักเรียนคนนี้</button></div>');}
window.repDetail=repDetail;
function delStudent(i){const k=RKEYS[i];if(!k)return;const p=k.split('|');
  if(!confirm('ลบข้อมูลทั้งหมดของ '+p[2]+' (ชั้น '+p[0]+' เลขที่ '+p[1]+') ใช่ไหม?'))return;
  REP=REP.filter(r=>!((r.cls||'-')===p[0]&&(r.no||'-')===p[1]&&(r.name||'-')===p[2]));saveRep();teacherReport();}
window.delStudent=delStudent;
function clearReport(){if(!confirm('⚠️ ลบรายงานของนักเรียนทั้งหมดใช่ไหม? (กู้คืนไม่ได้)'))return;if(!confirm('ยืนยันอีกครั้ง: ข้อมูลทั้งหมดจะถูกลบถาวร'))return;REP=[];saveRep();teacherReport();}
window.clearReport=clearReport;
function changePass(){const a=prompt('ใส่รหัสผ่านใหม่ (อย่างน้อย 4 ตัว):');if(a===null)return;
  if(a.length<4){alert('รหัสสั้นเกินไป');return;}const b=prompt('ยืนยันรหัสผ่านใหม่อีกครั้ง:');
  if(a!==b){alert('รหัสผ่านไม่ตรงกัน');return;}setPass(a);alert('✅ เปลี่ยนรหัสผ่านเรียบร้อยแล้ว');}
window.changePass=changePass;
function csvCell(v){v=String(v==null?'':v).replace(/"/g,'""');return '"'+v+'"';}
function exportCSV(){loadRep();if(!REP.length){alert('ยังไม่มีข้อมูลให้ส่งออก');return;}
  const head=['วัน-เวลา','ชื่อ-นามสกุล','ชั้น','เลขที่','ด่าน','ประเภท','โจทย์','คำตอบนักเรียน/เสียงที่AIได้ยิน','ผล','เวลาที่ใช้(วินาที)','คะแนนสะสม'];
  const lines=[head.map(csvCell).join(',')];
  REP.slice().sort((a,b)=>a.t-b.t).forEach(r=>{lines.push([dts(r.t),r.name,r.cls,r.no,r.lv||'',r.type,r.q,r.ans,r.kind==='ans'?(r.ok?'ถูก':'ผิด'):r.type,r.sec||0,r.score||0].map(csvCell).join(','));});
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date();
  a.href=url;a.download='รายงานคะแนน_Comparative_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);}
window.exportCSV=exportCSV;

/* ---------- 12) ลูปหลัก ---------- */
let acc=0,last=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=now-last;last=now;if(dt>250)dt=250;acc+=dt;let steps=0;
  while(acc>=16.667&&steps<4){update();acc-=16.667;steps++;}draw();}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.st==='play')togglePause();});
addEventListener('beforeunload',()=>{if(G.st==='play'||G.st==='paused')saveRun();else saveGame();});
['pointerdown','touchstart','keydown'].forEach(ev=>document.body.addEventListener(ev,audioUnlock,{once:true}));
loadGame();loadStu();loadRep();checkOri();hud();
if(STU.name){SID=Date.now();menu();}else loginCard();
requestAnimationFrame(loop);
</script>
